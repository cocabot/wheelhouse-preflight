name: Release

on:
  push:
    branches: [main]
    paths: ['.github/release-version']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version to release from this commit (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import re

          tree = ast.parse(pathlib.Path('src/wheelhouse_preflight/__init__.py').read_text())
          version = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets)
          )
          if not isinstance(version, str) or not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Release requires a stable X.Y.Z package version')
          event = os.environ['EVENT_NAME']
          ref = os.environ['REF']
          if event == 'workflow_dispatch' and ref == 'refs/heads/main':
              requested = os.environ['REQUESTED_VERSION']
          elif event == 'push' and ref.startswith('refs/tags/v'):
              requested = os.environ['REF_NAME'].removeprefix('v')
          elif event == 'push' and ref == 'refs/heads/main':
              requested = pathlib.Path('.github/release-version').read_text(encoding='utf-8').strip()
          else:
              raise SystemExit('Release requires a version tag or an authorized main-branch trigger')
          if requested != version:
              raise SystemExit(f'Requested version {requested!r} does not match package version {version!r}')
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          entry = re.search(rf'^## {re.escape(version)} — (\d{{4}}-\d{{2}}-\d{{2}})\n(.*?)(?=^## |\Z)', changelog, re.MULTILINE | re.DOTALL)
          if entry is None:
              raise SystemExit('Changelog must contain a dated entry for the requested release')
          pathlib.Path('release-notes.md').write_text(entry.group(0).strip() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'RELEASE_TAG=v{version}\n')
          PY
      - name: Build distributions and checksums
        run: |
          python -m pip install build==1.2.2
          python -m build
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          existing_ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .ref")
          if [ -n "$existing_ref" ]; then
            tagged_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            if [ "$tagged_commit" != "$RELEASE_COMMIT" ]; then
              echo 'The existing tag does not point to the validated commit.' >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
